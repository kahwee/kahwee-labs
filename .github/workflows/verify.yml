name: Verify
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.0.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Preserve the verify gate without overlapping output-producing builds.
      - parallel:
          - name: Type check
            run: pnpm typecheck
          - name: Test
            run: pnpm test
      - name: Build
        run: pnpm build
