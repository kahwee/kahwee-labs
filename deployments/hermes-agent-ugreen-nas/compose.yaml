services:
  hermes:
    image: ${HERMES_IMAGE:?Set HERMES_IMAGE to an immutable name@sha256 digest}
    container_name: hermes-agent
    restart: unless-stopped
    command: ["gateway", "run"]
    volumes:
      - type: bind
        source: ${HERMES_DATA_DIR:-/volume1/docker/hermes}
        target: /opt/data
        bind:
          create_host_path: false
    environment:
      HERMES_UID: ${HERMES_UID:?Set the verified numeric UID}
      HERMES_GID: ${HERMES_GID:?Set the verified numeric GID}
    security_opt:
      - no-new-privileges:true
    mem_limit: 4g
    cpus: 2.0
    pids_limit: 512
